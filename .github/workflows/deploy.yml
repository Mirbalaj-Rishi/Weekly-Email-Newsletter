name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for GitHub OIDC -> AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CDK CLI and Python dependencies
        run: |
          npm install -g aws-cdk
          pip install -r infra/requirements.txt

      - name: Validate required secrets
        run: |
          arn="${AWS_DEPLOY_ROLE_ARN}"
          region="${AWS_REGION}"
          if [ -z "$region" ]; then
            echo "::error::AWS_REGION secret is empty or unset."
            exit 1
          fi
          if [ -z "$arn" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN secret is empty or unset."
            exit 1
          fi
          echo "AWS_DEPLOY_ROLE_ARN length: ${#arn}"
          if ! echo "$arn" | grep -Eq '^arn:aws:iam::[0-9]{12}:role/.+$'; then
            echo "::error::AWS_DEPLOY_ROLE_ARN does not match the expected pattern 'arn:aws:iam::<12-digit-account-id>:role/<name>'. Check for pasted whitespace, newlines, or an accidentally-included 'StackName.Output = ' prefix."
            exit 1
          fi
          echo "AWS_DEPLOY_ROLE_ARN looks well-formed."
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: "Debug: inspect actual OIDC token claims"
        run: |
          RESPONSE=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESPONSE" | jq -r '.value')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to obtain an ID token from GitHub. Raw response: $RESPONSE"
            exit 1
          fi
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          MOD=$(( ${#PAYLOAD} % 4 ))
          if [ "$MOD" -eq 2 ]; then PAYLOAD="${PAYLOAD}=="; fi
          if [ "$MOD" -eq 3 ]; then PAYLOAD="${PAYLOAD}="; fi
          echo "Decoded claims from the token GitHub actually sent to AWS:"
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, iss, repository, repository_owner, ref, event_name}'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK synth
        working-directory: infra
        run: cdk synth NewsletterStack
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: CDK deploy
        working-directory: infra
        run: cdk deploy NewsletterStack --require-approval never
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
